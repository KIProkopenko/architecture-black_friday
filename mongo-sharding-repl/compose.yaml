services:
  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router_repl
    ports:
      - 8082:8082
    environment:
      MONGODB_URL: "mongodb://mongos_router_repl:27020"
      MONGODB_DATABASE_NAME: "somedb"
    networks:
      app-network:
        # любой свободный адрес в той же подсети, что у остальных
        ipv4_address: 172.28.0.5  
      
      

  configSrv-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: configSrv-1
    restart: always
    ports:
      - "27017:27017"
    networks:
      app-network:
        ipv4_address: 172.28.0.10
    volumes:
      - config-data-1:/data/db
    command:
      [
        "--configsvr",  #запуск в режиме конфигурации
        "--replSet",
        "config_server",
        "--bind_ip_all",
        "--port",
        "27017"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s
    
  configSrv-2:
      image: dh-mirror.gitverse.ru/mongo:latest
      container_name: configSrv-2
      restart: always
      ports:
        - "27018:27018"
      networks:
        app-network:
          ipv4_address: 172.28.0.11
      volumes:
        - config-data-2:/data/db
      command:
        [
          "--configsvr",  #запуск в режиме конфигурации
          "--replSet",
          "config_server",
          "--bind_ip_all",
          "--port",
          "27018"
        ]
      healthcheck:
        test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
        interval: 5s
        start_period: 10s
    
  configSrv-3:
      image: dh-mirror.gitverse.ru/mongo:latest
      container_name: configSrv-3
      restart: always
      ports:
        - "27019:27019"
      networks:
        app-network:
          ipv4_address: 172.28.0.12
      volumes:
        - config-data-3:/data/db
      command:
        [
          "--configsvr",  #запуск в режиме конфигурации
          "--replSet",
          "config_server",
          "--bind_ip_all",
          "--port",
          "27019"
        ]
      healthcheck:
        test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
        interval: 5s
        start_period: 10s
  
  shard1-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-1
    restart: always
    ports:
      - "27021:27021"
    networks:
      app-network:
        ipv4_address: 172.28.0.13
    volumes:
      - shard1-1-data:/data/db
    command:
      [
        "--shardsvr", #запуск в режиме шардинга
        "--replSet",
        "shard1rs", #название реплики
        "--bind_ip_all",
        "--port",
        "27021"
      ]
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s
  
  shard1-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-2
    restart: always
    ports:
