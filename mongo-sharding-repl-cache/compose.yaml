    networks:
      app-network:

  shard2-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2-3
    ports:
      - "27026:27026"
    volumes:
      - shard2-3-data:/data/db
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet", "shard2rs",
        "--bind_ip_all",
        "--port", "27026"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--port", "27026", "--eval", "db.adminCommand('ping')"]
