services:
  pymongo_api:
    container_name: sharding-repl-cache
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router_repl
      - redis             
    ports:
      - "8082:8082"
    environment:
      MONGODB_URL: "mongodb://mongos_router_repl:27020"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis:6379"   
    networks:
      app-network:


  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      app-network:


  configSrv-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: configSrv-1
    ports:
      - "27017:27017"
    volumes:
      - config-data-1:/data/db
    command:
      [
        "mongod",
        "--configsvr",
        "--replSet", "config_server",
        "--bind_ip_all",
        "--port", "27017"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s
    networks:
      app-network:

  configSrv-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: configSrv-2
    ports:
      - "27018:27018"
    volumes:
      - config-data-2:/data/db
    command:
      [
        "mongod",
        "--configsvr",
        "--replSet", "config_server",
        "--bind_ip_all",
        "--port", "27018"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s
    networks:
      app-network:

  configSrv-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: configSrv-3
    ports:
      - "27019:27019"
    volumes:
      - config-data-3:/data/db
    command:
      [
        "mongod",
        "--configsvr",
        "--replSet", "config_server",
        "--bind_ip_all",
        "--port", "27019"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s
    networks:
      app-network:

  
  shard1-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-1
    ports:
      - "27021:27021"
    volumes:
      - shard1-1-data:/data/db
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet", "shard1rs",
        "--bind_ip_all",
        "--port", "27021"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--port", "27021", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s
    networks:
      app-network:

  shard1-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-2
    ports:
      - "27022:27022"
    volumes:
      - shard1-2-data:/data/db
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet", "shard1rs",
        "--bind_ip_all",
        "--port", "27022"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--port", "27022", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s
    networks:
      app-network:

  shard1-3:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard1-3
    ports:
      - "27023:27023"
    volumes:
      - shard1-3-data:/data/db
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet", "shard1rs",
        "--bind_ip_all",
        "--port", "27023"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--port", "27023", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s
    networks:
      app-network:

  
  shard2-1:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2-1
    ports:
      - "27024:27024"
    volumes:
      - shard2-1-data:/data/db
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet", "shard2rs",
        "--bind_ip_all",
        "--port", "27024"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--port", "27024", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s
    networks:
      app-network:

  shard2-2:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: shard2-2
    ports:
      - "27025:27025"
    volumes:
      - shard2-2-data:/data/db
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet", "shard2rs",
        "--bind_ip_all",
        "--port", "27025"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--port", "27025", "--eval", "db.adminCommand('ping')"]
      interval: 5s
