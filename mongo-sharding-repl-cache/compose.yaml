version: '3.8'

services:
  pymongo_api:
    container_name: sharding-repl-cache
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router_repl
      - redis
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongos_router_repl:27020"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis:6379"
    networks:
      app-network:

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      app-network:

  configSrv-1:
    image: mongo:6.0.14 # Заменено
    container_name: configSrv-1
    ports:
      - "27017:27017"
    volumes:
      - config-data-1:/data/db
    command:
      [
        "mongod",
        "--configsvr",
        "--replSet", "config_server",
        "--bind_ip_all",
        "--port", "27017"
      ]
    # healthcheck обновлён
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27017 --quiet --eval \"try { const result = db.adminCommand('ping'); process.exit(result.ok === 1 ? 0 : 1); } catch(e) { print('Health check failed:', e.message); process.exit(1); }\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s # Увеличено для инициализации
    networks:
      app-network:

  configSrv-2:
    image: mongo:6.0.14 # Заменено
    container_name: configSrv-2
    ports:
      - "27018:27018"
