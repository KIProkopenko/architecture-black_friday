    networks:
      app-network:

  
  mongos_router_repl:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongos_router_repl
    depends_on:
      - configSrv-1
      - configSrv-2
      - configSrv-3
    ports:
      - "27020:27020"
    command:
      [
        "mongos",
        "--configdb", "config_server/configSrv-1:27017,configSrv-2:27018,configSrv-3:27019",
        "--bind_ip_all",
        "--port", "27020"
      ]
    healthcheck:
      test: ["CMD", "mongo", "--port", "27020", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      start_period: 10s
    networks:
      app-network:


networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24

volumes:
  config-data-1:
  config-data-2:
  config-data-3:
  shard1-1-data:
  shard1-2-data:
  shard1-3-data:
  shard2-1-data:
  shard2-2-data:
  shard2-3-data: