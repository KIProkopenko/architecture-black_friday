      - config-data-2:/data/db
    command:
      [
        "mongod",
        "--configsvr",
        "--replSet", "config_server",
        "--bind_ip_all",
        "--port", "27018"
      ]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 27018 --quiet --eval \"try { const result = db.adminCommand('ping'); process.exit(result.ok === 1 ? 0 : 1); } catch(e) { print('Health check failed:', e.message); process.exit(1); }\""]
